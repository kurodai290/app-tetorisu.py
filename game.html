<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>テトリス - プレイ画面</title>
    <style>
        body {
            background: #222;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            position: relative;
            display: flex;
            gap: 20px;
            background: #111;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            border: 2px solid #333;
            background: #111;
        }
        .info-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 120px;
            font-size: 24px;
        }
        .info-group {
            margin-bottom: 20px;
        }
        .info-label {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
        }
        .info-value {
            font-size: 32px;
            font-weight: bold;
            color: #0DFF72;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none; /* 初期状態は非表示 */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        #overlay h2 {
            color: #FF0D72;
            font-size: 40px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255,13,114,0.5);
        }
        .menu-btn {
            padding: 10px 25px;
            font-size: 18px;
            font-weight: bold;
            background-color: #0DFF72;
            color: #111;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(13, 255, 114, 0.3);
            transition: transform 0.1s;
            margin: 5px;
        }
        .menu-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- テトリス盤面 (横12マス×縦20マス) -->
        <canvas id="canvas" width="240" height="400"></canvas>
        
        <!-- スコア・レベル表示パネル -->
        <div class="info-panel">
            <div class="info-group">
                <div class="info-label">SCORE</div>
                <div id="score" class="info-value">0</div>
            </div>
            <div class="info-group">
                <div class="info-label">LEVEL</div>
                <div id="level" class="info-value">1</div>
            </div>
        </div>

        <!-- ゲームオーバー時のはめ込み画面 -->
        <div id="overlay">
            <h2>GAME OVER</h2>
            <button class="menu-btn" onclick="startGame()">RETRY</button>
            <button class="menu-btn" onclick="location.href='index.html'">TITLE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.scale(20, 20);

        let score = 0;
        let level = 1;
        let gameRunning = false;
        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let animationId = null; 

        function updateInfo() {
            document.getElementById('score').innerText = score;
            document.getElementById('level').innerText = level;
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0) {
                        if (!arena[y + o.y] || arena[y + o.y][x + o.x] === undefined || arena[y + o.y][x + o.x] !== 0) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) { matrix.push(new Array(w).fill(0)); }
            return matrix;
        }

        let arena = createMatrix(12, 20);
        const player = {
            pos: {x: 0, y: 0},
            matrix: null
        };

        // 各ミノの形状と対応する色インデックス(1〜7)を定義
        function createPiece(type) {

                return [,

            } else if (type === 'L') {

            } else if (type === 'J') {
                return [,

            } else if (type === 'O') {
                return [,

            } else if (type === 'Z') {
                return [,

            } else if (type === 'S') {
                return [,

                ];
            } else if (type === 'T') {
                return [,

                ];
            }
        }

        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawGrid() {
            ctx.lineWidth = 0.03;
            ctx.strokeStyle = '#2d2d2d';
            for (let x = 0; x <= 12; x++) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 20); ctx.stroke();
            }
            for (let y = 0; y <= 20; y++) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(12, y); ctx.stroke();
            }
        }

        function drawMatrix(matrix, offset) {
            const colors = [null, '#0DC2FF', '#FF8E0D', '#3877FF', '#FFE138', '#FF0D72', '#0DFF72', '#F538FF'];
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = colors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                        ctx.lineWidth = 0.05;
                        ctx.strokeStyle = '#111';
                        ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y >= 0; --y) { 
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) { continue outer; }
                }
                arena.splice(y, 1);
                arena.unshift(new Array(12).fill(0)); 
                ++y;
                score += rowCount * 10;
                rowCount *= 2;
            }
            let newLevel = Math.floor(score / 100) + 1;
            if (newLevel > 10) newLevel = 10;
            if (newLevel !== level) {
                level = newLevel;
                dropInterval = 1000 - (level - 1) * 100;
            }
            updateInfo();
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) { arena[y + player.pos.y][x + player.pos.x] = value; }
                });
            });
        }

        function playerDrop() {
            if (!gameRunning) return;
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            if (!gameRunning) return;
            while (!collide(arena, player)) { player.pos.y++; }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            dropCounter = 0;
        }

        // 途切れていたプレイヤー移動処理の補完
        function playerMove(dir) {
            if (!gameRunning) return;
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        // ミノをランダムに生成・初期位置へ配置（ゲームオーバー判定）
        function playerReset() {
            const pieces = 'ILJOZST';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            
            // 出現時に即衝突する場合はゲームオーバー
            if (collide(arena, player)) {
                gameRunning = false;
                cancelAnimationFrame(animationId);
                document.getElementById('overlay').style.display = 'flex';
            }
        }

        // ミノの回転処理（壁蹴り簡易対応）
        function playerRotate(dir) {
            if (!gameRunning) return;
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
