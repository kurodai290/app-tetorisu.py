<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>キー設定 - Tetris</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:sans-serif;padding:25px}
main{max-width:650px;margin:auto}
h1{font-size:26px}
.card{background:#1b1b1b;border:1px solid #555;border-radius:8px;padding:15px;margin:10px 0}
.row{display:grid;grid-template-columns:1fr 180px;gap:10px;align-items:center;margin:9px 0}
.key{
  background:#333;color:#fff;border:1px solid #888;border-radius:6px;
  padding:10px;text-align:center;cursor:pointer;min-height:42px
}
.key.waiting{background:#684}
button,.back{
  background:#333;color:#fff;border:1px solid #888;border-radius:6px;
  padding:10px 14px;font-size:15px;text-decoration:none;cursor:pointer
}
button:hover,.back:hover,.key:hover{background:#444}
.note{color:#bbb;font-size:14px;line-height:1.6}
#message{min-height:25px;margin:10px 0}
@media(max-width:600px){
  body{padding:12px}
  .row{grid-template-columns:1fr 130px}
}
</style>
</head>
<body>
<main>
<h1>⚙ テトリス キー設定</h1>
<p class="note">
変更したい操作の「変更」ボタンを押してから、割り当てたいキーボードのキーを押してください。<br>
設定はこのブラウザに保存され、ゲーム本体にも自動的に反映されます。
</p>

<div class="card" id="settings"></div>

<div id="message"></div>

<button id="save">設定を保存</button>
<button id="reset">初期設定に戻す</button>
<a class="back" href="index.html">ゲームへ戻る</a>
</main>

<script>
"use strict";

const DEFAULT_KEYS = {
  left: "ArrowLeft",
  right: "ArrowRight",
  down: "ArrowDown",
  rotate: "ArrowUp",
  hardDrop: " ",
  hold: "z"
};

const LABELS = {
  left: "左移動",
  right: "右移動",
  down: "ソフトドロップ",
  rotate: "回転",
  hardDrop: "ハードドロップ",
  hold: "ホールド"
};

let config = {};
try {
  config = JSON.parse(localStorage.getItem("tetrisKeyConfig") || "null") || {...DEFAULT_KEYS};
} catch(e) {
  config = {...DEFAULT_KEYS};
}

let waiting = null;

function displayKey(k){
  if(k === " ") return "Space";
  if(k === "ArrowLeft") return "←";
  if(k === "ArrowRight") return "→";
  if(k === "ArrowUp") return "↑";
  if(k === "ArrowDown") return "↓";
  if(k === "Escape") return "Esc";
  if(k === "Enter") return "Enter";
  if(k === "Shift") return "Shift";
  if(k === "Control") return "Ctrl";
  if(k === "Alt") return "Alt";
  return k;
}

function render(){
  const box=document.getElementById("settings");
  box.innerHTML="";

  Object.keys(LABELS).forEach(action=>{
    const row=document.createElement("div");
    row.className="row";

    const label=document.createElement("div");
    label.textContent=LABELS[action];

    const btn=document.createElement("button");
    btn.className="key";
    btn.textContent=waiting===action ? "キーを押してください" : displayKey(config[action]);
    if(waiting===action) btn.classList.add("waiting");

    btn.onclick=()=>{
      waiting=action;
      document.getElementById("message").textContent="「"+LABELS[action]+"」に割り当てるキーを押してください。";
      render();
    };

    row.appendChild(label);
    row.appendChild(btn);
    box.appendChild(row);
  });
}

document.addEventListener("keydown",e=>{
  if(waiting===null) return;

  e.preventDefault();

  if(e.key==="Escape"){
    waiting=null;
    document.getElementById("message").textContent="変更をキャンセルしました。";
    render();
    return;
  }

  let value=e.key;

  // 同じキーの二重割り当てを避ける
  const duplicate=Object.keys(config).find(a=>a!==waiting && config[a]===value);
  if(duplicate){
    document.getElementById("message").textContent=
      "そのキーは「"+LABELS[duplicate]+"」に使用されています。別のキーを選んでください。";
    return;
  }

  config[waiting]=value;
  document.getElementById("message").textContent=
    LABELS[waiting]+" を「"+displayKey(value)+"」に設定しました。";
  waiting=null;
  render();
});

document.getElementById("save").onclick=()=>{
  localStorage.setItem("tetrisKeyConfig",JSON.stringify(config));
  document.getElementById("message").textContent="設定を保存しました。ゲームに戻ると反映されます。";
};

document.getElementById("reset").onclick=()=>{
  config={...DEFAULT_KEYS};
  localStorage.setItem("tetrisKeyConfig",JSON.stringify(config));
  waiting=null;
  document.getElementById("message").textContent="初期設定に戻しました。";
  render();
};

render();
</script>
</body>
</html>
