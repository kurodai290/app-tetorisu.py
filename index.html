<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tetris Production</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#111;color:#fff;font-family:sans-serif}
body{display:flex;justify-content:center;align-items:flex-start;gap:20px;padding:18px;touch-action:auto}
canvas{background:#000;border:2px solid #fff;display:block;width:300px;height:600px;touch-action:none}
.panel{width:250px}
h1{font-size:22px;margin:0 0 10px}
.box{border:1px solid #666;padding:8px;margin:7px 0;background:#181818}
button{
  background:#333;color:#fff;border:1px solid #777;border-radius:7px;
  padding:10px 13px;font-size:16px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none
}
button:active{background:#555;transform:scale(.97)}
#status{min-height:26px}
.mobile-controls{
  display:none;
  width:300px;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}
.mobile-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  min-height:62px;
  padding:4px;
  background:#333;
  color:#fff;
  border:2px solid #777;
  border-radius:9px;
  font-size:25px;
  font-weight:bold;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}
.mobile-btn:active{background:#666;transform:scale(.96)}
.mobile-btn small{font-size:11px;font-weight:normal}
.settings-link{color:#fff;text-decoration:none;display:inline-block;padding:8px 10px;border:1px solid #777;border-radius:6px;background:#222}
@media(max-width:700px){
  body{flex-direction:column;align-items:center;gap:8px;padding:8px}
  canvas{width:300px;height:600px}
  .panel{width:300px}
  .panel h1{display:none}
  .box{display:inline-block;margin:3px;padding:6px}
  #status{display:block}
  #restart{width:100%}
  .mobile-controls{display:grid}
  .panel p{font-size:13px}
}
@media(min-width:701px){
  .mobile-controls{display:none}
}
</style>
</head>
<body>
<div>
  <canvas id="game" width="300" height="600"></canvas>
  <div class="mobile-controls" aria-label="スマホ操作">
    <button type="button" class="mobile-btn" data-action="hold">H<br><small>ホールド</small></button>
    <button type="button" class="mobile-btn" data-action="rotate">↻<br><small>回転</small></button>
    <button type="button" class="mobile-btn" data-action="drop">⬇<br><small>ハード</small></button>

    <button type="button" class="mobile-btn" data-action="left">←</button>
    <button type="button" class="mobile-btn" data-action="down">↓</button>
    <button type="button" class="mobile-btn" data-action="right">→</button>
  </div>
</div>

<div class="panel">
  <h1>テトリス</h1>
  <div class="box">スコア: <span id="score">0</span></div>
  <div class="box">ハイスコア: <span id="high">0</span></div>
  <div class="box">ライン: <span id="lines">0</span></div>
  <div class="box">レベル: <span id="level">1</span></div>
  <div class="box">コンボ: <span id="combo">0</span></div>
  <div class="box">ホールド: <span id="hold">なし</span></div>
  <div class="box">次ミノ: <span id="next">-</span></div>
  <div class="box" id="status">ゲーム開始</div>
  <button id="restart">リスタート</button><br><br><a class="settings-link" href="settings.html">⚙ キー設定</a>
  <p>PC: ← → 移動 / ↑ 回転 / ↓ ソフトドロップ<br>Space: ハードドロップ / Z: ホールド</p>
  <p>スマホ：画面のボタンで操作できます。盤面タップ＝回転、左右スワイプ＝移動、上下スワイプ＝ハードドロップ。</p><p>特殊技: Tスピン / Tスピンミニ / コンボ / バック・トゥ・バック</p>
</div>

<script src="tetris.js"></script>
</body>
</html>
