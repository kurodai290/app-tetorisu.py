<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>シンプルテトリス - スタートボタン付き</title>
    <style>
        body { background: #333; color: white; text-align: center; font-family: sans-serif; }
        .container { position: relative; display: inline-block; margin-top: 10px; }
        canvas { border: 2px solid white; background: #111; display: block; }
        .score-board { font-size: 24px; font-weight: bold; margin: 10px 0; color: #0DFF72; }
        
        /* スタート画面の重ね合わせ */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        /* スタート・リスタートボタンの見た目 */
        .start-btn {
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            background-color: #0DFF72;
            color: #111;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(13, 255, 114, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }
        .start-btn:hover { background-color: #0bd65f; transform: scale(1.05); }
        .start-btn:active { transform: scale(0.95); }
        
        .game-over-text { color: #FF0D72; font-size: 28px; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>TETRIS</h1>
    <div class="score-board">SCORE: <span id="score">0</span></div>
    
    <div class="container">
        <!-- ゲーム開始・終了時のオーバーレイ画面 -->
        <div id="overlay" class="overlay">
            <div id="game-status-text" class="game-over-text" style="display: none;">GAME OVER</div>
            <button id="start-button" class="start-btn" onclick="startGame()">START GAME</button>
        </div>
        <canvas id="canvas" width="240" height="400"></canvas>
    </div>

    <p>操作方法：左右矢印キー（移動） / 上矢印キー（回転） / 下矢印キー（加速落下）</p>
    <p>スペースキー：一気に落とす（ハードドロップ）</p>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.scale(20, 20);

        let score = 0;
        let gameRunning = false; // ゲームが実行中かどうかを管理するフラグ

        function updateScore() {
            document.getElementById('score').innerText = score;
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) { matrix.push(new Array(w).fill(0)); }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'T') return [[0, 0, 0], [1, 1, 1], [0, 1, 0]];
            if (type === 'O') return [[2, 2], [2, 2]];
            if (type === 'L') return [[0, 0, 3], [3, 3, 3], [0, 0, 0]];
            if (type === 'J') return [[4, 0, 0], [4, 4, 4], [0, 0, 0]];
            if (type === 'I') return [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]];
            if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            if (type === 'Z') return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
        }

        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = colors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) { continue outer; }
                }
                const row = arena.splice(y, 1).fill(0);
                arena.unshift(row);
                ++y;

                score += rowCount * 10;
                rowCount *= 2;
            }
            updateScore();
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) { arena[y + player.pos.y][x + player.pos.x] = value; }
                });
            });
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) { player.pos.x -= dir; }
        }

        // ゲーム終了処理の追加
        function gameOver() {
            gameRunning = false;
            document.getElementById('game-status-text').style.display = 'block';
            document.getElementById('start-button').innerText = 'RESTART GAME';
            document.getElementById('overlay').style.display = 'flex';
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena.length / 2 | 0) - (player.matrix.length / 2 | 0);
            if (collide(arena, player)) {
                gameOver(); // ぶつかったらゲームオーバー画面へ
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix.length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) { matrix.forEach(row => row.reverse()); } 
            else { matrix.reverse(); }
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        function update(time = 0) {
            if (!gameRunning) return; // フラグがオフなら処理をストップ
            
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) { playerDrop(); }
            draw();
            requestAnimationFrame(update);
        }

        // ボタンが押されたときにゲームを開始する関数
        function startGame() {
            // フィールドとスコアの初期化
            arena.forEach(row => row.fill(0));
            score = 0;
            updateScore();
            
            // 画面表示の切り替え
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('game-status-text').style.display = 'none';
            
            // ゲーム開始
            gameRunning = true;
            playerReset();
            lastTime = performance.now(); // 時間のズレを防止
            update();
        }

        const arena = createMatrix(12, 20);
        const player = { pos: {x: 0, y: 0}, matrix: null };

        document.addEventListener('keydown', event => {
            if (!gameRunning) return; // ゲーム中以外はキー操作を受け付けない
            
            if (event.keyCode === 37) { playerMove(-1); }
            else if (event.keyCode === 39) { playerMove(1); }
            else if (event.keyCode === 40) { playerDrop(); }
            else if (event.keyCode === 38) { playerRotate(1); }
            else if (event.keyCode === 32) { 
                event.preventDefault();
                playerHardDrop(); 
            }
        });

        // 最初のロード時は背景だけ描画しておく
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
</html>
