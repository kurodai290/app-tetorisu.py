<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>シンプルテトリス - スコア＆ハードドロップ機能付き</title>
    <style>
        body { background: #333; color: white; text-align: center; font-family: sans-serif; }
        canvas { border: 2px solid white; background: #111; }
        .score-board { font-size: 24px; font-weight: bold; margin: 10px 0; color: #0DFF72; }
    </style>
</head>
<body>
    <h1>TETRIS</h1>
    <!-- スコア表示エリアを追加 -->
    <div class="score-board">SCORE: <span id="score">0</span></div>
    <canvas id="canvas" width="240" height="400"></canvas>
    <p>操作方法：左右矢印キー（移動） / 上矢印キー（回転） / 下矢印キー（加速落下）</p>
    <p><strong>【新機能】スペースキー：一気に落とす（ハードドロップ）</strong></p>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.scale(20, 20);

        // スコア管理用
        let score = 0;

        function updateScore() {
            document.getElementById('score').innerText = score;
        }

        // ブロックの当たり判定
        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        // 舞台の作成
        function createMatrix(w, h) {
            const matrix = [];
            while (h--) { matrix.push(new Array(w).fill(0)); }
            return matrix;
        }

        // ブロックの形（前回のバグ修正：各形状の配列を正しく定義）
        function createPiece(type) {
            if (type === 'T') return [[0,0,0],[1,1,1],[0,1,0]];
            if (type === 'O') return [[2,2],[2,2]];
            if (type === 'L') return [[0,0,3],[3,3,3],[0,0,0]];
            if (type === 'J') return [[4,0,0],[4,4,4],[0,0,0]];
            if (type === 'I') return [[0,5,0,0],[0,5,0,0],[0,5,0,0],[0,5,0,0]];
            if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
            if (type === 'Z') return [[7,7,0],[0,7,7],[0,0,0]];
        }

        // 描画
        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = colors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        // ライン消去＆スコア加算機能
        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) { continue outer; }
                }
                const row = arena.splice(y, 1).fill(0);
                arena.unshift(row);
                ++y;

                // スコア計算（同時に消すラインが多いほど高得点）
                score += rowCount * 10;
                rowCount *= 2;
            }
            updateScore();
        }

        // ブロックを固定
        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) { arena[y + player.pos.y][x + player.pos.x] = value; }
                });
            });
        }

        // 通常の落下処理
        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        // 【新機能】一気に落とす（ハードドロップ）
        function playerHardDrop() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--; // ぶつかる直前の位置に戻す
            merge(arena, player);
            playerReset();
            arenaSweep();
            dropCounter = 0;
        }

        // 左右移動
        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) { player.pos.x -= dir; }
        }

        // ゲームオーバーとリセット
        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0)); // 画面全消去
                score = 0;                         // スコアもリセット
                updateScore();
            }
        }

        // 回転
        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) { matrix.forEach(row => row.reverse()); } 
            else { matrix.reverse(); }
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) { playerDrop(); }
            draw();
            requestAnimationFrame(update);
        }

        const arena = createMatrix(12, 20);
        const player = { pos: {x: 0, y: 0}, matrix: null };

        // キーボード操作の変更
        document.addEventListener('keydown', event => {
            if (event.keyCode === 37) { playerMove(-1); }       // ◀ キー
            else if (event.keyCode === 39) { playerMove(1); }    // ▶ キー
            else if (event.keyCode === 40) { playerDrop(); }     // ▼ キー
            else if (event.keyCode === 38) { playerRotate(1); }   // ▲ キー
            else if (event.keyCode === 32) {                      // スペースキー（ハードドロップ）
                event.preventDefault(); // 画面が下にスクロールするのを防ぐ
                playerHardDrop(); 
            }
        });

        playerReset();
        updateScore();
        update();
    </script>
</body>
</html>
