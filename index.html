<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>テトリス - スタートメニュー</title>
    <style>
        body { 
            background: #333; 
            color: white; 
            text-align: center; 
            font-family: sans-serif; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 48px;
            letter-spacing: 5px;
            margin-bottom: 30px;
            color: #0DFF72;
            text-shadow: 0 0 10px rgba(13, 255, 114, 0.5);
        }
        .start-btn {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            background-color: #0DFF72;
            color: #111;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(13, 255, 114, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }
        .start-btn:hover { 
            background-color: #0bd65f; 
            transform: scale(1.05); 
        }
        .start-btn:active { 
            transform: scale(0.95); 
        }
    </style>
</head>
<body>

    <h1>TETRIS</h1>
    <!-- ボタンを押すと game.html に画面が切り替わります -->
    <button class="start-btn" onclick="location.href='game.html'">START GAME</button>

</body>
</html>
